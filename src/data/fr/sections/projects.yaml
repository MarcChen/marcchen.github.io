- name: RBM Binary AlphaDigits
  role: Auteur
  timeline: "2024"
  repo: https://github.com/MarcChen/RBM_BinaryAlphaDigits
  summary: "Implémentation d'une Machine de Boltzmann Restreinte (RBM) entraînée sur le jeu de données Binary AlphaDigits en utilisant la Divergence Contrastive. Couvre la génération d'images, l'optimisation des hyperparamètres et les expériences sur l'influence du nombre de caractères à travers plusieurs notebooks Jupyter. Inclut un rapport de recherche complémentaire (Chen & Sebti)."
  tags: ["academic", "machine-learning", "deep-learning", "RBM", "MNIST"]

name: Deploy to Github Pages

# run when a commit is pushed to "source" branch
on:
  push:
    branches:
    - main

env:
  # Public cloud name – inlined at build time so cloudinaryUrl() generates CDN URLs
  NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    # checkout to the commit that has been pushed
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install node modules
      run: npm ci

    # Upload images to Cloudinary so they're available when the site is deployed.
    # Images that already exist are skipped (idempotent).
    # Only runs on main branch – PR previews keep using local fallback.
    - name: Upload images to Cloudinary
      run: npm run images:upload
      env:
        CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
        CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

    # Build with NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME set → all image URLs
    # point to Cloudinary with f_auto,q_auto transformations.
    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}

    # push the generated content into the `gh-pages` branch.
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./out
